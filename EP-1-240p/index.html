<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Episode 1 | Motion Library</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #000;
			--panel: #121212;
			--line: rgba(255,255,255,.12);
			--muted: #a9a9a9;
			--text: #f2f2f2;
			--chip: rgba(255,255,255,.08);
			--red: #ff0033;
		}
		* { box-sizing: border-box; }
		html, body {
			height: 100%;
			overflow: hidden;
		}
		body {
			margin: 0;
			background: var(--bg);
			color: var(--text);
			font: 14px/1.4 Arial, Helvetica, sans-serif;
		}
		a { color: inherit; }
		header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			width: min(100%, calc(100% - 28px));
			margin: 0 auto;
			padding: 12px 0 8px;
		}
		.brand {
			font-size: 15px;
			font-weight: 700;
			letter-spacing: -0.03em;
			text-decoration: none;
		}
		.brand span { color: var(--red); }
		.back {
			color: var(--muted);
			text-decoration: none;
			font-size: 12px;
		}
		.back:hover, .back:focus-visible { color: var(--text); }
		main {
			width: 100%;
			height: calc(100vh - 54px);
			display:flex;
			flex-direction:column;
			padding: 0 0 12px;
		}
		.player-shell {
			flex: 1;
			display: flex;
			flex-direction: column;
			background: #000;
			padding: 0 0 10px;
		}
		.screen {
			position: relative;
			overflow: hidden;
			background: #000;
			width: 100%;
			aspect-ratio: 16 / 9;
			flex: 0 1 auto;
			max-height: calc(100vh - 170px);
			min-height: 0;
		}
		#motion {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: contain;
			background: #000;
		}
		#paused-frame {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: contain;
			background: #000;
		}
		.loading {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			color: #9f9f9f;
			font-size: 12px;
			letter-spacing: .08em;
			text-transform: uppercase;
			pointer-events: none;
			background: rgba(0,0,0,.18);
		}
		.controls {
			padding: 8px 12px 10px;
			background: rgba(18,18,18,.96);
			border-top: 1px solid var(--line);
			border-bottom: 1px solid var(--line);
		}
		.seek-row {
			display: grid;
			grid-template-columns: 1fr auto;
			align-items: center;
			gap: 12px;
		}
		input[type="range"] {
			width: 100%;
			height: 4px;
			accent-color: var(--red);
			cursor: pointer;
		}
		.time {
			color: var(--muted);
			font-variant-numeric: tabular-nums;
			white-space: nowrap;
			font-size: 12px;
		}
		.button-row {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			margin-top: 8px;
		}
		button {
			border: 0;
			padding: 8px 12px;
			border-radius: 999px;
			background: var(--chip);
			color: var(--text);
			font: inherit;
			cursor: pointer;
			transition: background .15s ease, transform .15s ease;
		}
		button:hover, button:focus-visible {
			background: rgba(255,255,255,.14);
			outline: none;
		}
		button:active { transform: scale(.98); }
		.play {
			min-width: 48px;
			font-size: 20px;
			line-height: 1;
			background: #f0f0f0;
			color: #111;
		}
		.skip {
			font-size: 11px;
			font-weight: 700;
			letter-spacing: .04em;
		}
		.hud {
			position: absolute;
			left: 12px;
			bottom: 12px;
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 6px 10px;
			border-radius: 999px;
			background: rgba(0,0,0,.45);
			border: 1px solid rgba(255,255,255,.12);
			font-size: 11px;
			color: var(--muted);
			pointer-events: none;
		}
		.hud strong {
			color: var(--text);
			font-weight: 700;
		}
		@media (max-width: 760px) {
			.seek-row { grid-template-columns: 1fr; }
		}
	</style>
</head>
<body>
	<header>
		<a class="brand" href="../index.html"><span>●</span> Motion Library</a>
		<a class="back" href="../index.html">All episodes</a>
	</header>
	<main>
		<div class="player-shell">
			<div class="screen">
				<img id="motion" src="MD-EP1-AWEBP/EP1-1.webp" alt="Episode 1 motion frame" loading="eager" decoding="sync">
				<canvas id="paused-frame" aria-hidden="true" hidden></canvas>
				<div class="loading" id="loading">Loading segment 1...</div>
				<div class="hud" aria-live="polite">
					<strong id="segment-number">1</strong>
					<span>/ 65</span>
					<span id="cache-status">Loading sequence...</span>
				</div>
			</div>
			<div class="controls">
				<div class="seek-row">
					<input id="seek" type="range" min="0" max="1600" value="0" step="25" aria-label="Seek through the episode timeline">
					<span class="time"><span id="current-time">0:00</span> / <span id="total-time">26:48</span></span>
				</div>
				<div class="button-row">
					<button class="skip" id="restart" type="button" aria-label="Restart video">&#9205;</button>
					<button class="skip" id="previous-frame" type="button" aria-label="Previous frame">&#9664;&#9664;</button>
					<button class="skip" id="rewind" type="button" aria-label="Rewind 25 seconds">&#8634; 25s</button>
					<button class="play" id="play" type="button" aria-label="Play or pause">&#9654;</button>
					<button class="skip" id="forward" type="button" aria-label="Fast forward 25 seconds">25s &#8635;</button>
					<button class="skip" id="next-frame" type="button" aria-label="Next frame">&#9654;&#9654;</button>
					<button class="skip" id="end" type="button" aria-label="Jump to end">&#9203;</button>
				</div>
			</div>
		</div>
	</main>
	<script>
		const segmentCount = 65;
		const segmentDurations = Array.from({ length: segmentCount }, (_, index) => index === segmentCount - 1 ? 14.94 : 24.9);
		const segmentStarts = segmentDurations.reduce((starts, duration, index) => {
			starts.push((starts[index - 1] || 0) + (index === 0 ? 0 : segmentDurations[index - 1]));
			return starts;
		}, []);
		const seekInterval = 25;
		const cacheRadius = 10;
		const totalDuration = segmentDurations.reduce((sum, duration) => sum + duration, 0);
		const image = document.querySelector('#motion');
		const pausedFrame = document.querySelector('#paused-frame');
		const pausedFrameContext = pausedFrame.getContext('2d');
		const loading = document.querySelector('#loading');
		const seek = document.querySelector('#seek');
		const currentTime = document.querySelector('#current-time');
		const segmentNumber = document.querySelector('#segment-number');
		const cacheStatus = document.querySelector('#cache-status');
		const playButton = document.querySelector('#play');
		const images = new Map();
		let activeSegment = 1;
		let currentTimeValue = 0;
		let playing = false;
		let playbackStartStamp = 0;
		let playbackStartTime = 0;
		let animationFrame;

		const srcFor = number => `MD-EP1-AWEBP/EP1-${number}.webp`;
		const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
		const formatTime = seconds => {
			const mins = Math.floor(seconds / 60);
			const secs = Math.floor(seconds % 60);
			return `${mins}:${String(secs).padStart(2, '0')}`;
		};

		function preload(number) {
			if (number < 1 || number > segmentCount || images.has(number)) return;
			const preloaded = new Image();
			preloaded.src = srcFor(number);
			images.set(number, preloaded);
		}

		function updateCache() {
			const first = Math.max(1, activeSegment - cacheRadius);
			const last = Math.min(segmentCount, activeSegment + cacheRadius);
			for (let number = first; number <= last; number += 1) preload(number);
			cacheStatus.textContent = `Frame ${activeSegment} / ${segmentCount}`;
		}

		function showSegment(number) {
			activeSegment = clamp(number, 1, segmentCount);
			pausedFrame.hidden = true;
			image.hidden = false;
			image.src = srcFor(activeSegment);
			segmentNumber.textContent = activeSegment;
			loading.textContent = `Loading frame ${activeSegment}...`;
			loading.hidden = false;
			updateCache();
		}

		function renderFromTime(seconds) {
			currentTimeValue = clamp(seconds, 0, totalDuration - 0.01);
			const nextSegment = segmentStarts.findIndex((start, index) => currentTimeValue < start + segmentDurations[index]) + 1;
			if (nextSegment !== activeSegment) {
				showSegment(nextSegment);
			}
			seek.value = (activeSegment - 1) * seekInterval;
			currentTime.textContent = formatTime(currentTimeValue);
		}

		function tick(timestamp) {
			if (!playing) return;
			const nextTime = playbackStartTime + (timestamp - playbackStartStamp) / 1000;
			if (nextTime >= totalDuration - 0.01) {
				renderFromTime(totalDuration - 0.01);
				playing = false;
				playButton.textContent = '\u25B6';
				cancelAnimationFrame(animationFrame);
				return;
			}
			renderFromTime(nextTime);
			animationFrame = requestAnimationFrame(tick);
		}

		function togglePlayback() {
			playing = !playing;
			playButton.textContent = playing ? '\u23F8' : '\u25B6';
			if (playing) {
				pausedFrame.hidden = true;
				image.hidden = false;
				image.src = srcFor(activeSegment);
				playbackStartStamp = performance.now();
				playbackStartTime = currentTimeValue;
				animationFrame = requestAnimationFrame(tick);
			} else {
				cancelAnimationFrame(animationFrame);
				if (image.complete && image.naturalWidth) {
					freezeCurrentFrame();
				} else {
					image.addEventListener('load', freezeCurrentFrame, { once: true });
				}
			}
		}

		function pausePlayback() {
			if (playing) togglePlayback();
			else cancelAnimationFrame(animationFrame);
		}

		function freezeCurrentFrame() {
			if (!image.complete || !image.naturalWidth) return;
			pausedFrame.width = image.naturalWidth;
			pausedFrame.height = image.naturalHeight;
			pausedFrameContext.drawImage(image, 0, 0);
			image.hidden = true;
			pausedFrame.hidden = false;
		}

		function moveToSegment(number) {
			const target = clamp(number, 1, segmentCount);
			renderFromTime(segmentStarts[target - 1]);
			if (playing) {
				playbackStartStamp = performance.now();
				playbackStartTime = currentTimeValue;
			} else if (image.complete && image.naturalWidth) {
				freezeCurrentFrame();
			} else {
				image.addEventListener('load', freezeCurrentFrame, { once: true });
			}
		}

		image.addEventListener('load', () => {
			loading.hidden = true;
			if (!playing) freezeCurrentFrame();
		});
		image.addEventListener('error', () => {
			loading.textContent = `Frame ${activeSegment} failed to load`;
		});

		playButton.addEventListener('click', togglePlayback);
		document.querySelector('#restart').addEventListener('click', () => {
			pausePlayback();
			renderFromTime(0);
		});
		document.querySelector('#rewind').addEventListener('click', () => {
			pausePlayback();
			moveToSegment(activeSegment - 1);
		});
		document.querySelector('#forward').addEventListener('click', () => {
			pausePlayback();
			moveToSegment(activeSegment + 1);
		});
		document.querySelector('#previous-frame').addEventListener('click', () => moveToSegment(activeSegment - 1));
		document.querySelector('#next-frame').addEventListener('click', () => moveToSegment(activeSegment + 1));
		document.querySelector('#end').addEventListener('click', () => {
			pausePlayback();
			renderFromTime(totalDuration - 0.01);
		});
		seek.addEventListener('input', (event) => {
			pausePlayback();
			const selectedSegment = Math.round(Number(event.target.value) / seekInterval) + 1;
			moveToSegment(selectedSegment);
		});

		seek.max = String(totalDuration);
		seek.value = '0';
		renderFromTime(0);
		document.querySelector('#total-time').textContent = formatTime(totalDuration);
	</script>
</body>
</html>
